pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

dependencyResolutionManagement {
    versionCatalogs {
        printLibs {
            from(files('libpretixprint-repo/libpretixprint/gradle/libs.versions.toml'))
        }
    }
}

include ':app', ':libpretixprint', ':cups4j', ':ZSDK', ':EvolisSDK'
project(':libpretixprint').projectDir = new File('libpretixprint-repo/libpretixprint')
